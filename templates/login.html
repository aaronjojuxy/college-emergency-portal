{% extends "base.html" %}

{% block title %}Sign In | Campus Emergency Assistance Portal{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow border-0 rounded-4 overflow-hidden">
                <div class="bg-danger text-white text-center py-4 px-3">
                    <i class="fa-solid fa-shield-halved fa-3x mb-2"></i>
                    <h3 class="fw-bold mb-0">Emergency Portal Login</h3>
                    <p class="small text-white-50 mb-0">Access student safety console or responder control room</p>
                </div>

                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('login', next=request.args.get('next')) }}">
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold">Username / Roll No</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fa-solid fa-user text-muted"></i></span>
                                <input type="text" class="form-control" id="username" name="username" placeholder="e.g. student1, security1, admin" required autofocus>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fa-solid fa-lock text-muted"></i></span>
                                <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-danger w-100 py-2 fw-bold shadow-sm">
                            <i class="fa-solid fa-right-to-bracket me-1"></i> Sign In to Portal
                        </button>
                    </form>

                    <!-- Quick Demo Credentials Selector -->
                    <div class="mt-4 pt-3 border-top">
                        <p class="small text-muted fw-bold mb-2 text-center"><i class="fa-solid fa-wand-magic-sparkles text-warning me-1"></i> 1-Click Demo Credential Fill:</p>
                        <div class="d-grid gap-2">
                            <button type="button" class="btn btn-outline-secondary btn-sm text-start" onclick="fillCreds('student1', 'password123')">
                                <i class="fa-solid fa-user-graduate text-primary me-2"></i> <strong>Student:</strong> Alex Rivera (<code>student1</code>)
                            </button>
                            <button type="button" class="btn btn-outline-secondary btn-sm text-start" onclick="fillCreds('security1', 'security123')">
                                <i class="fa-solid fa-shield text-danger me-2"></i> <strong>Responder:</strong> Security Patrol (<code>security1</code>)
                            </button>
                            <button type="button" class="btn btn-outline-secondary btn-sm text-start" onclick="fillCreds('admin', 'admin123')">
                                <i class="fa-solid fa-user-tie text-success me-2"></i> <strong>Chief Proctor/Admin:</strong> Dr. Vance (<code>admin</code>)
                            </button>
                        </div>
                    </div>

                    <div class="text-center mt-4">
                        <p class="small text-muted mb-0">
                            New student? <a href="{{ url_for('register') }}" class="text-danger fw-bold">Register Your Profile Here</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function fillCreds(u, p) {
    document.getElementById('username').value = u;
    document.getElementById('password').value = p;
}
</script>
{% endblock %}
